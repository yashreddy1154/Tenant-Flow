{% extends 'auth_base.html' %}

{% block title %}Join Team | TenantFlow{% endblock %}

{% block content %}
    <h1 class="auth-title">Join your team</h1>
    <p class="auth-subtitle">Set a password to complete your account</p>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Set Password & Join</button>
    </form>
{% endblock %}
