{% extends 'auth_base.html' %}

{% block title %}Log in | TenantFlow{% endblock %}

{% block content %}
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to your TenantFlow account</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Email Address</label>
            <input type="email" name="username" id="id_username" required>
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" class="btn">Log In</button>
    </form>

    <div class="auth-footer">
        Don't have an organization? <a href="{% url 'signup' %}">Create one</a>
    </div>
{% endblock %}
