<a href="{% url 'task_detail' task.pk %}" style="text-decoration: none; color: inherit; display: block;">
    <div style="background: white; padding: 1rem; border-radius: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); cursor: pointer; transition: box-shadow 0.2s;" onmouseover="this.style.boxShadow='0 4px 6px rgba(0,0,0,0.05)'" onmouseout="this.style.boxShadow='0 1px 2px rgba(0,0,0,0.05)'">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <span style="font-size: 0.65rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">{{ task.project.name }}</span>
            
            {% if task.priority == 'High' %}
                <span style="width: 8px; height: 8px; border-radius: 50%; background-color: #EF4444; title: High Priority"></span>
            {% elif task.priority == 'Medium' %}
                <span style="width: 8px; height: 8px; border-radius: 50%; background-color: #F59E0B; title: Medium Priority"></span>
            {% else %}
                <span style="width: 8px; height: 8px; border-radius: 50%; background-color: #10B981; title: Low Priority"></span>
            {% endif %}
        </div>
        
        <h4 style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.75rem; color: var(--text-primary);">{{ task.title }}</h4>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 0.75rem; color: var(--text-secondary);">
                {% if task.due_date %}
                    <svg style="width: 12px; height: 12px; display: inline-block; vertical-align: middle; margin-right: 0.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    {{ task.due_date|date:"M d" }}
                {% endif %}
            </div>
            
            {% if task.assignee %}
                <div style="width: 20px; height: 20px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 600;" title="{{ task.assignee.email }}">
                    {{ task.assignee.email|make_list|first|upper }}
                </div>
            {% else %}
                <div style="width: 20px; height: 20px; border: 1px dashed var(--border-color); border-radius: 50%;" title="Unassigned"></div>
            {% endif %}
        </div>
    </div>
</a>
