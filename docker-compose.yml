version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tenant_flow_db
    environment:
      POSTGRES_DB: ${DB_NAME:-tenant_flow}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
